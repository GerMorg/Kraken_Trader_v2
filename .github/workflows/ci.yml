name: Kraken Trader v2 CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check kraken_margin_trader/app tests scripts
      - run: mypy kraken_margin_trader/app --ignore-missing-imports
      - run: python -m pytest -q
  security:
    name: Security and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: bandit -q -r kraken_margin_trader/app
      - run: pip-audit
  apparmor:
    name: AppArmor profile syntax and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y apparmor
      - run: sudo apparmor_parser --skip-kernel-load --warn=all kraken_margin_trader/apparmor.txt

  ha_structure:
    name: Home Assistant add-on structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/validate_ha_app.py
  compile:
    name: Python compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q kraken_margin_trader/app tests scripts
  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f kraken_margin_trader/Dockerfile -t kraken-trader-v2:ci kraken_margin_trader
      # Verify the application also starts if Docker is explicitly configured for an unprivileged UID.
      - run: docker run --rm --user 10001:10001 --tmpfs /data/state:rw,uid=10001,gid=10001,mode=700 --tmpfs /data/logs:rw,uid=10001,gid=10001,mode=700 kraken-trader-v2:ci --healthcheck
      # Home Assistant normally starts the container as root. The real entrypoint must
      # prepare root-owned persistent mounts, preserve private options, and drop to UID 10001.
      - name: Verify default entrypoint drops root before Python startup
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/kraken-data"
          printf '{"kraken_api_key":"ci-test-key","kraken_api_secret":"ci-test-secret"}\n' > "${RUNNER_TEMP}/kraken-data/options.json"
          python3 - "${RUNNER_TEMP}/kraken-data/kraken_trader.sqlite3" <<'PY'
          import sqlite3, sys
          connection = sqlite3.connect(sys.argv[1])
          connection.execute("CREATE TABLE legacy_probe (value TEXT NOT NULL)")
          connection.execute("INSERT INTO legacy_probe VALUES ('preserved')")
          connection.commit()
          connection.close()
          PY
          sudo chown -R 0:0 "${RUNNER_TEMP}/kraken-data"
          sudo chmod 0400 "${RUNNER_TEMP}/kraken-data/options.json"
          output="$(docker run --rm --mount type=bind,source="${RUNNER_TEMP}/kraken-data",target=/data --tmpfs /config:rw,uid=0,gid=0,mode=700 kraken-trader-v2:ci --healthcheck 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "uid=10001 gid=10001"
          printf '%s\n' "$output" | grep -F '"credentials_present":true'
          test -f "${RUNNER_TEMP}/kraken-data/state/kraken_trader.sqlite3"
          test ! -e "${RUNNER_TEMP}/kraken-data/kraken_trader.sqlite3"
          test "$(stat -c '%u:%g:%a' "${RUNNER_TEMP}/kraken-data/options.json")" = "0:0:400"
          sudo python3 - "${RUNNER_TEMP}/kraken-data/state/kraken_trader.sqlite3" <<'PY'
          import sqlite3, sys
          connection = sqlite3.connect(sys.argv[1])
          value = connection.execute("SELECT value FROM legacy_probe").fetchone()[0]
          connection.close()
          assert value == "preserved", value
          PY